CONFIG_GPIO=y
CONFIG_I2C=y


# Wi-Fi Configuration
CONFIG_WIFI=y
CONFIG_WIFI_NM=y
CONFIG_WIFI_USAGE_MODE_STA_AP=y

# Network Configuration
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IF_MAX_IPV4_COUNT=2
CONFIG_NET_IF_MAX_IPV6_COUNT=2
CONFIG_NET_IPV4=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=10
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NETWORKING=y

# Heap size for Wi-Fi/HTTP/DNS
CONFIG_HEAP_MEM_POOL_SIZE=98304

# NVS storage for Wi-Fi credentials
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y

# LOG Configuration
CONFIG_NET_LOG=y
CONFIG_NET_DHCPV4_SERVER_LOG_LEVEL_DBG=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3


#### 配网相关配置(不增大不行) ####
# Main Stack Size (Increased for WiFi and System Init)
CONFIG_MAIN_STACK_SIZE=8192

# ISR Stack Size (Increased for complex WiFi/Logging interrupts)
CONFIG_ISR_STACK_SIZE=4096

# 系统工作队列栈大小：用于处理网络后台事件
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096


# =====================================================
#  MQTT相关
# =====================================================
# 启用 JSON 库
CONFIG_JSON_LIBRARY=y

# 启用浮点数打印支持 (printk %f)
CONFIG_CBPRINTF_FP_SUPPORT=y

# 启用 DNS 解析（如果 MQTT_BROKER 是域名则必须开启）
CONFIG_DNS_RESOLVER=y

# 启用 POSIX API 兼容层（允许使用 socket/connect 等标准名称）
CONFIG_POSIX_API=y

# 启用 Zephyr 官方 MQTT 库
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y

# 缓冲区与性能优化 (防止连接被重置)
# 这里的缓冲区大小直接影响高并发或大数据包时的稳定性
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32

# Uart 相关(用于Uart 传感器)
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Sensor 传感器框架
CONFIG_SENSOR=y
CONFIG_AHT10=y